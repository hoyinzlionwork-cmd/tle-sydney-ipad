<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Taronga Zoo 園區地圖</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zoo Map">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--ink:#333336;--ink2:#8E8E93;--ink3:#B9B9BF;--line:#E5E5EA;--navy:#0B2545;--red:#E60012;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button,input{font-family:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-top)) 14px 8px;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.top .t{font-size:16px;font-weight:900;flex:1;line-height:1.2;min-width:0}
.top .t small{display:block;font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
@media (max-width:420px){.top .t small{display:none}.top .t{font-size:15px}}
.body{flex:1;min-height:0;display:flex;position:relative}
.mapwrap{position:relative;flex:1;min-width:0;background:#DCE7D3;overflow:hidden;touch-action:none}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.layer img{display:block;pointer-events:none;-webkit-user-drag:none}
.layer svg{position:absolute;left:0;top:0;pointer-events:none}
.layer svg .zone{pointer-events:auto;cursor:pointer;fill-opacity:.18;stroke-width:8;stroke-opacity:.9;stroke-linejoin:round;transition:fill-opacity .25s,stroke-opacity .25s}
.layer svg .zone.dim{fill-opacity:.04;stroke-opacity:.25}
.layer svg .zone.on{fill-opacity:.08;stroke-width:14;stroke-opacity:1;filter:drop-shadow(0 0 18px rgba(255,255,255,.9))}
.layer svg .shade{fill:rgba(10,20,30,.55);pointer-events:none;opacity:0;transition:opacity .3s}
.layer svg .shade.on{opacity:1}
.zl{position:absolute;width:0;height:0;pointer-events:none}
.zl .b{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);border:3px solid;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:900;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25);color:var(--ink)}
.zl .b small{display:block;font-size:11px;font-weight:700;color:var(--ink2);text-align:center;letter-spacing:.5px}
.zl.dim{opacity:.35}
#zlabels.far .b{font-size:12px;padding:3px 9px;border-width:2px}
#zlabels.far .b small{display:none}
.mk{position:absolute;width:0;height:0;cursor:pointer}
.mk .c{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.3);animation:pop .3s ease-out}
.mk .n{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--ink);font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mk.show .c{border-color:#8E24AA}
.mk.food .c{border-color:#F57C00}
.mk.on .c{border-color:var(--red);transform:scale(1.25)}
.mk.on .n{background:var(--red);color:#fff}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.pin{position:absolute;width:0;height:0;pointer-events:none}
.pin .ring{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:4px solid var(--red);animation:ring 1.4s ease-out infinite}
.pin .ring2{animation-delay:.5s}
@keyframes ring{0%{transform:scale(.25);opacity:1}100%{transform:scale(1.4);opacity:0}}
.ctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.ctl button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.15);color:var(--ink)}
.hint{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink2);font-weight:600;pointer-events:none;z-index:3;max-width:60%}
/* ---- 側欄 / 底部抽屜 ---- */
.panel{background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex-shrink:0}
.ph .back{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
.ph .zt{flex:1;min-width:0}
.ph .zt b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .zt small{display:block;font-size:11.5px;color:var(--ink2);font-weight:700}
.search{padding:0 12px 8px;flex-shrink:0}
.search input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.search input:focus{outline:none;border-color:var(--navy)}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px calc(12px + var(--safe-bottom))}
.zc{display:flex;gap:12px;padding:12px 10px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;align-items:flex-start}
.zc:active{background:#F4F4F6}
.zc .sw{width:14px;align-self:stretch;border-radius:7px;flex-shrink:0}
.zc .zt{flex:1;min-width:0}
.zc .zn{font-size:15.5px;font-weight:900;line-height:1.3}
.zc .zn small{font-size:11.5px;color:var(--ink2);font-weight:700;margin-left:6px}
.zc .zd{font-size:12.5px;color:var(--ink);line-height:1.55;margin-top:4px}
.zc .zcnt{font-size:11.5px;color:var(--ink2);font-weight:700;margin-top:5px}
.zc.hot .zn::after{content:"★ 無尾熊合照";color:var(--red);font-size:11px;margin-left:6px;vertical-align:middle}
.zdesc{font-size:13px;line-height:1.6;color:var(--ink);background:#F7F7F8;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.gh{font-size:12px;font-weight:800;color:var(--ink2);margin:10px 4px 6px;letter-spacing:.5px}
.item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.item:active{background:#F4F4F6}
.item.on{background:#FDECEE}
.item .ic{width:36px;height:36px;border-radius:10px;background:#F0F0F2;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.item .tx{flex:1;min-width:0}
.item .zh{font-size:15px;font-weight:800;line-height:1.3}
.item .en{font-size:11.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tm{font-size:13px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .gd{font-size:11px;font-weight:800;color:#fff;background:var(--navy);border-radius:6px;padding:2px 7px}
.item .zb{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap}
.item.hot .zh::after{content:"★";color:var(--red);margin-left:5px;font-size:12px}
.empty{padding:30px 12px;text-align:center;color:var(--ink3);font-size:13px}
.handle{display:none}
@media (max-width:899px){
  .body{flex-direction:column}
  .panel{flex-shrink:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);height:45%;transition:height .25s}
  .panel.min{height:auto}
  .panel.min .ph,.panel.min .search,.panel.min .list{display:none}
  .panel.max{height:80%}
  .handle{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px 4px;cursor:pointer;flex-shrink:0}
  .handle::before{content:"";width:40px;height:5px;border-radius:3px;background:#D9D9DE}
  .handle .ht{font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel.min .handle{padding:10px 14px calc(10px + var(--safe-bottom))}
}
@media (min-width:900px){ .panel{width:360px;border-left:1px solid var(--line)} }
.editbar{display:none;position:absolute;left:12px;top:12px;z-index:4;background:#FFF8E6;border:1px solid #F5DFA0;color:#8A6400;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;max-width:70%}
.edit .editbar{display:block}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="t" id="title">Taronga Zoo 園區地圖<small>先選區域 → 邊界亮起 → 再看這區有什麼</small></div>
    <button id="sharebtn">分享</button>
  </div>
  <div class="body">
    <div class="mapwrap" id="wrap">
      <div class="layer" id="layer"><img id="mapimg" alt="Taronga Zoo map"><svg id="svg"></svg><div id="zlabels"></div><div id="marks"></div><div id="pins"></div></div>
      <div class="editbar" id="editbar">校正模式：先點清單項目，再點地圖上的正確位置。<button id="exportbtn" style="margin-left:8px;border:none;background:#8A6400;color:#fff;border-radius:6px;padding:3px 8px;font-size:12px">匯出</button></div>
      <div class="ctl"><button id="zin">＋</button><button id="zout">－</button><button id="zfit" style="font-size:12px">全圖</button></div>
      <div class="hint" id="hint">點地圖上的區域，或從下方選</div>
    </div>
    <div class="panel" id="panel">
      <div class="handle" id="handle"><span class="ht" id="handletxt">選一個區域 ▴</span></div>
      <div class="ph" id="ph"></div>
      <div class="search"><input id="q" type="search" placeholder="搜尋：無尾熊、koala、廁所、長頸鹿…"></div>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>
<script src="places.js"></script>
<script>
"use strict";
const D=window.ZOO_DATA, $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params=new URLSearchParams(location.search);
const EDIT=params.get("edit")==="1", EMBED=params.get("embed")==="1";
if(EDIT) document.body.classList.add("edit");
if(EMBED){ $("#sharebtn").style.display="none"; }

/* ---- 座標工具 ---- */
let overrides={}; try{ overrides=JSON.parse(localStorage.getItem("zoo_overrides")||"{}"); }catch(e){}
const gridXY=ref=>{ const m=/^(\d{1,2})([A-M])$/i.exec(String(ref).trim()); if(!m) return null; const x=D.cols[+m[1]],y=D.rows[m[2].toUpperCase()]; return x&&y?{x,y}:null; };
const pointsOf=p=>{ if(overrides[p.id]) return [overrides[p.id]]; if(p.x!=null) return [{x:p.x,y:p.y}]; if(p.grid){ const g=gridXY(p.grid); return g?[g]:[]; } if(p.grids) return p.grids.split(",").map(gridXY).filter(Boolean); return []; };
const inPoly=(pt,poly)=>{ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if(((yi>pt.y)!==(yj>pt.y))&&(pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi)) c=!c; } return c; };
const centroid=poly=>{ let x=0,y=0; poly.forEach(([a,b])=>{x+=a;y+=b;}); return {x:x/poly.length,y:y/poly.length}; };
const bounds=poly=>{ const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]); return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)}; };
/* 每個地點自動歸區（多點設施不歸區） */
D.places.forEach(p=>{ const pts=pointsOf(p); p.zone=(pts.length===1)?(D.zones.find(z=>inPoly(pts[0],z.poly))||{}).id||null:null; });
const zoneOf=id=>D.zones.find(z=>z.id===id);
const CATN={animal:"動物",show:"表演・體驗",food:"餐飲・購物",entry:"入口・交通",facility:"設施"};
const toMin=t=>{ const m=/(\d{1,2}):(\d{2})(am|pm)/i.exec(t||""); if(!m) return 9999; let h=+m[1]%12; if(m[3].toLowerCase()==="pm") h+=12; return h*60+ +m[2]; };

/* ---- 地圖基本 ---- */
const wrap=$("#wrap"), layer=$("#layer"), img=$("#mapimg"), svg=$("#svg"), marks=$("#marks"), pins=$("#pins"), zlabels=$("#zlabels");
img.src=D.img; img.width=D.w; img.height=D.h;
svg.setAttribute("width",D.w); svg.setAttribute("height",D.h); svg.setAttribute("viewBox",`0 0 ${D.w} ${D.h}`);
const MAX=2.6; let sc=0.2,tx=0,ty=0,minSc=0.1;
const apply=()=>{ layer.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`; const inv=`scale(${1/sc})`;
  layer.querySelectorAll(".pin,.mk,.zl").forEach(p=>p.style.transform=inv); zlabels.classList.toggle("far",sc<minSc*1.6); };
const clamp=()=>{ const W=wrap.clientWidth,H=wrap.clientHeight,w=D.w*sc,h=D.h*sc; tx=w<=W?(W-w)/2:Math.min(0,Math.max(W-w,tx)); ty=h<=H?(H-h)/2:Math.min(0,Math.max(H-h,ty)); };
const fit=()=>{ const W=wrap.clientWidth,H=wrap.clientHeight; if(!W||!H) return; sc=Math.min(W/D.w,H/D.h); minSc=sc; clamp(); apply(); };
const zoomAt=(f,cx,cy)=>{ const ns=Math.min(Math.max(sc*f,minSc),MAX),k=ns/sc; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; sc=ns; clamp(); apply(); };
const goTo=(x,y,s)=>{ const W=wrap.clientWidth,H=wrap.clientHeight; sc=Math.min(Math.max(s,minSc),MAX); tx=W/2-x*sc; ty=H/2-y*sc; clamp(); apply(); };
const fitBounds=(b,pad)=>{ pad=pad||120; const W=wrap.clientWidth,H=wrap.clientHeight; const s=Math.min(W/(b.x1-b.x0+pad*2),H/(b.y1-b.y0+pad*2)); goTo((b.x0+b.x1)/2,(b.y0+b.y1)/2,s); };

/* ---- 區域繪製 ---- */
let curZone=null, curPlace=null, query="";
function drawZones(){
  const shade=curZone?`<path class="shade on" fill-rule="evenodd" d="M0 0H${D.w}V${D.h}H0Z ${polyPath(curZone.poly)}"/>`:`<path class="shade" d=""/>`;
  svg.innerHTML=shade+D.zones.map(z=>`<path class="zone${curZone?(curZone.id===z.id?" on":" dim"):""}" data-z="${z.id}" d="${polyPath(z.poly)}" fill="${z.color}" stroke="${z.color}"/>`).join("");
  zlabels.innerHTML=D.zones.map(z=>{ const c=centroid(z.poly); const n=D.places.filter(p=>p.zone===z.id&&p.cat==="animal").length;
    return `<div class="zl${curZone&&curZone.id!==z.id?" dim":""}" style="left:${c.x}px;top:${c.y}px"><div class="b" style="border-color:${z.color}">${esc(z.short||z.zh)}<small>${n?n+" 種動物":esc(z.en)}</small></div></div>`; }).join("");
  apply();
}
const polyPath=poly=>"M"+poly.map(p=>p.join(" ")).join("L")+"Z";

/* ---- 面板 ---- */
function renderPanel(){
  const ph=$("#ph"), list=$("#list"), q=query.trim().toLowerCase();
  if(q){
    ph.innerHTML=`<div class="zt"><b>搜尋「${esc(query)}」</b><small>全園區</small></div>`;
    const items=D.places.filter(p=>(p.zh+" "+p.en+" "+(p.area||"")+" "+(p.note||"")).toLowerCase().includes(q));
    list.innerHTML=items.length?items.map(itemHTML).join(""):`<div class="empty">找不到「${esc(query)}」</div>`;
  }else if(curZone){
    const z=curZone, items=D.places.filter(p=>p.zone===z.id);
    ph.innerHTML=`<button class="back" id="backbtn">← 全部區域</button><div class="zt"><b style="color:${z.color}">${esc(z.zh)}</b><small>${esc(z.en)}</small></div>`;
    const groups=[["animal","🐾 這區的動物"],["show","🕐 表演・體驗（以現場公告為準）"],["food","🍽️ 餐飲・購物"],["entry","🚪 入口・交通"],["facility","ℹ️ 設施"]];
    list.innerHTML=`<div class="zdesc">${esc(z.desc)}</div>`+groups.map(([c,l])=>{ let its=items.filter(p=>p.cat===c); if(!its.length) return ""; if(c==="show") its=its.slice().sort((a,b)=>toMin(a.time)-toMin(b.time)); return `<div class="gh">${l}</div>`+its.map(itemHTML).join(""); }).join("")
      +(items.length?"":`<div class="empty">這區尚未標記地點</div>`);
    $("#backbtn").onclick=()=>selectZone(null);
  }else{
    ph.innerHTML=`<div class="zt"><b>園區分區</b><small>點一區看邊界與這區的動物</small></div>`;
    list.innerHTML=D.zones.map(z=>{ const n=D.places.filter(p=>p.zone===z.id&&p.cat==="animal").length, s=D.places.filter(p=>p.zone===z.id&&p.cat==="show").length;
      return `<div class="zc${z.hot?" hot":""}" data-z="${z.id}"><div class="sw" style="background:${z.color}"></div><div class="zt"><div class="zn">${esc(z.zh)}<small>${esc(z.en)}</small></div><div class="zd">${esc(z.desc)}</div><div class="zcnt">${n} 種動物${s?` · ${s} 場表演`:""}</div></div></div>`; }).join("")
      +`<div class="gh">🕐 全日表演時刻</div>`+D.places.filter(p=>p.cat==="show").slice().sort((a,b)=>toMin(a.time)-toMin(b.time)).map(itemHTML).join("")
      +`<div class="gh">ℹ️ 全園設施</div>`+D.places.filter(p=>p.cat==="facility"&&p.grids).map(itemHTML).join("");
    list.querySelectorAll(".zc").forEach(el=>el.onclick=()=>selectZone(zoneOf(el.dataset.z)));
  }
  list.querySelectorAll(".item").forEach(el=>el.onclick=()=>selectPlace(D.places.find(p=>p.id===el.dataset.id)));
}
function itemHTML(p){ const z=p.zone?zoneOf(p.zone):null;
  return `<div class="item${p.hot?" hot":""}${curPlace&&curPlace.id===p.id?" on":""}" data-id="${p.id}">
    <div class="ic">${p.em||"📍"}</div>
    <div class="tx"><div class="zh">${esc(p.zh)}</div><div class="en">${esc(p.en)}${p.area?` · ${esc(p.area)}`:""}${p.note?` · ${esc(p.note)}`:""}</div></div>
    ${p.time?`<div class="tm">${esc(p.time)}</div>`:""}${p.grid?`<span class="gd">${esc(p.grid)}</span>`:""}${p.grids?`<span class="gd">${p.grids.split(",").length} 處</span>`:""}
    ${(!curZone||query)&&z?`<span class="zb" style="background:${z.color}">${esc(z.short||z.zh)}</span>`:""}
  </div>`; }
$("#q").oninput=e=>{ query=e.target.value; renderPanel(); };

/* ---- 選區域：邊界亮起、其餘壓暗、圖標跑出來 ---- */
function selectZone(z, keepPanel){
  curZone=z; curPlace=null; query=""; $("#q").value="";
  drawZones(); pins.innerHTML="";
  if(z){
    const items=D.places.filter(p=>p.zone===z.id&&p.cat!=="facility");
    marks.innerHTML=items.map(p=>{ const o=pointsOf(p)[0]; return `<div class="mk ${p.cat}" data-id="${p.id}" style="left:${o.x}px;top:${o.y}px"><div class="c">${p.em||"📍"}</div><div class="n">${esc(p.zh)}${p.time?` ${esc(p.time)}`:""}</div></div>`; }).join("");
    marks.querySelectorAll(".mk").forEach(m=>m.onclick=e=>{ e.stopPropagation(); selectPlace(D.places.find(p=>p.id===m.dataset.id)); });
    fitBounds(bounds(z.poly),160);
    $("#handletxt").textContent=`${z.zh} ▴ 這區有 ${items.filter(p=>p.cat==="animal").length} 種動物`;
    $("#hint").textContent="點圖標看名稱；「全圖」回到分區";
  }else{
    marks.innerHTML=""; fit();
    $("#handletxt").textContent="選一個區域 ▴"; $("#hint").textContent="點地圖上的區域，或從下方選";
  }
  apply(); renderPanel();
  if(!keepPanel&&matchMedia("(max-width:899px)").matches) setPanel(z?"min":"mid");
}
/* ---- 選單一地點：該圖標變紅＋脈衝 ---- */
function selectPlace(p, keepPanel){
  if(p.zone&&(!curZone||curZone.id!==p.zone)) selectZone(zoneOf(p.zone),true);
  curPlace=p; renderPanel();
  marks.querySelectorAll(".mk").forEach(m=>m.classList.toggle("on",m.dataset.id===p.id));
  const pts=pointsOf(p);
  pins.innerHTML=pts.map(o=>`<div class="pin" style="left:${o.x}px;top:${o.y}px"><div class="ring"></div><div class="ring ring2"></div></div>`).join("");
  if(!p.zone&&pts.length){ /* 多點設施：顯示全部位置 */
    marks.innerHTML=pts.map((o,i)=>`<div class="mk on" style="left:${o.x}px;top:${o.y}px"><div class="c">${p.em||"📍"}</div><div class="n">${esc(p.zh)}${p.grids?" "+esc(p.grids.split(",")[i]):""}</div></div>`).join("");
    const xs=pts.map(o=>o.x),ys=pts.map(o=>o.y); fitBounds({x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)},300);
  }else if(pts.length===1){ goTo(pts[0].x,pts[0].y,Math.max(sc,0.55)); }
  apply();
  $("#handletxt").textContent=`${p.em||""} ${p.zh} ▴`;
  if(!keepPanel&&matchMedia("(max-width:899px)").matches) setPanel("min");
}

/* ---- 手勢 ---- */
const pts=new Map(); let start=null,lastTap=0,moved=false;
const snap=()=>{ const a=[...pts.values()]; if(a.length>=2) return {n:2,d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,sc,tx,ty}; if(a.length===1) return {n:1,x:a[0].x,y:a[0].y,tx,ty}; return null; };
wrap.addEventListener("pointerdown",e=>{ if(e.target.closest(".ctl,.editbar")) return; e.preventDefault(); wrap.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); start=snap(); moved=false; });
wrap.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const cur=snap(); if(!start||!cur||cur.n!==start.n){ start=snap(); return; }
  const r=wrap.getBoundingClientRect();
  if(cur.n===2){ const ns=Math.min(Math.max(start.sc*cur.d/start.d,minSc),MAX),k=ns/start.sc,mx=start.mx-r.left,my=start.my-r.top; tx=mx-(mx-start.tx)*k+(cur.mx-start.mx); ty=my-(my-start.ty)*k+(cur.my-start.my); sc=ns; moved=true; }
  else{ const dx=cur.x-start.x,dy=cur.y-start.y; if(Math.hypot(dx,dy)>6) moved=true; tx=start.tx+dx; ty=start.ty+dy; }
  clamp(); apply(); });
const up=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if(pts.size===0&&!moved){ const r=wrap.getBoundingClientRect(), now=Date.now();
    if(EDIT&&curPlace){ overrides[curPlace.id]={x:Math.round((e.clientX-r.left-tx)/sc),y:Math.round((e.clientY-r.top-ty)/sc)}; localStorage.setItem("zoo_overrides",JSON.stringify(overrides)); D.places.forEach(p=>{ const q=pointsOf(p); p.zone=q.length===1?(D.zones.find(z=>inPoly(q[0],z.poly))||{}).id||null:null; }); selectPlace(curPlace,true); return; }
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const mk=el&&el.closest(".mk"); if(mk&&mk.dataset.id){ selectPlace(D.places.find(p=>p.id===mk.dataset.id)); lastTap=0; start=snap(); return; }
    if(el&&el.classList&&el.classList.contains("zone")){ const z=zoneOf(el.dataset.z); if(!curZone||curZone.id!==z.id){ selectZone(z); lastTap=0; start=snap(); return; } }
    if(now-lastTap<320){ zoomAt(sc>minSc*1.8?minSc/sc:2.4,e.clientX-r.left,e.clientY-r.top); lastTap=0; } else lastTap=now; }
  start=snap(); };
wrap.addEventListener("pointerup",up); wrap.addEventListener("pointercancel",up);
wrap.addEventListener("wheel",e=>{ e.preventDefault(); const r=wrap.getBoundingClientRect(); zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top); },{passive:false});
$("#zin").onclick=()=>zoomAt(1.4,wrap.clientWidth/2,wrap.clientHeight/2);
$("#zout").onclick=()=>zoomAt(1/1.4,wrap.clientWidth/2,wrap.clientHeight/2);
$("#zfit").onclick=()=>selectZone(null,true);
$("#exportbtn").onclick=async()=>{ const t=JSON.stringify(overrides); try{ await navigator.clipboard.writeText(t); alert("已複製 "+Object.keys(overrides).length+" 筆校正位置"); }catch(e){ prompt("複製下方內容",t); } };

/* 手機抽屜 */
let panelState="mid";
function setPanel(s){ panelState=s; const p=$("#panel"); p.classList.toggle("min",s==="min"); p.classList.toggle("max",s==="max"); }
$("#handle").onclick=()=>setPanel(panelState==="min"?"mid":panelState==="mid"?"max":"min");

/* 分享 */
$("#sharebtn").onclick=async()=>{ const url=location.origin+location.pathname;
  if(navigator.share){ try{ await navigator.share({title:"Taronga Zoo 園區地圖",url}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); alert("連結已複製：\n"+url); }catch(e){ prompt("複製連結",url); } };

drawZones(); renderPanel();
img.onload=()=>{ fit(); const z=params.get("z"), p=params.get("p");
  if(p){ const pl=D.places.find(x=>x.id===p); if(pl) selectPlace(pl,true); } else if(z){ const zz=zoneOf(z); if(zz) selectZone(zz,true); } };
window.addEventListener("resize",()=>{ clamp(); apply(); });
</script>
</body>
