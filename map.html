<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Taronga Zoo 園區地圖</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zoo Map">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --ink:#0A1F5C;--ink2:#667085;--ink3:#B4BAC4;--text:#2B2F36;--line:#E6E8EC;--paper:#FFFFFF;
  --sky:#0A1F5C;--sky2:#1C3F8F;--sky3:#3D6CC4;--gold:#E2C77A;--prism:linear-gradient(90deg,#BFE0FF,#D8CCFF,#FFC9E0,#FFE2B0);
  --land:linear-gradient(135deg,#0A1F5C 0%,#1C3F8F 100%);--forest:#538834;--outline:rgba(255,255,255,.85);--outline-inner:rgba(11,37,69,.22);--chip-border:rgba(11,37,69,.18);--grabber:#D9DCE2;
  --halo:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff);--sign-lift:drop-shadow(0 1px 0 rgba(0,0,0,.18));
  --shadow-ctl:0 1px 3px rgba(11,37,69,.14);--shadow-sheet:0 -4px 16px rgba(11,37,69,.08);
  --font:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --panel-w:320px;--peek:88px;--top-h:52px;--dur:200ms;--dur-layout:250ms;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;touch-action:pan-x pan-y}
button,input{font-family:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff}
/* ---- 頂欄 ---- */
/* 頁首：與領隊 iPad App 同一套「星引南十字」深藍星空；內嵌在 App 內時整個隱藏（App 自己有頁首） */
.top{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:calc(6px + var(--safe-top)) 16px 6px;min-height:calc(var(--top-h) + var(--safe-top));color:#fff;position:relative;overflow:hidden;z-index:6;
  background:#0A1F5C url(img/kv/bg.jpg) 100% 15% / 230% auto no-repeat}
.top>*{position:relative}
.top .t{flex:1;min-width:0;font-size:18px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;text-shadow:0 2px 10px rgba(5,20,60,.5)}
.top .t small{font-family:var(--font);font-size:11px;letter-spacing:2.5px;opacity:.8;margin-left:10px;font-weight:600}
.top .btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);color:#fff}
body.embed .top{display:none}
@media (max-width:430px){.top .t small{display:none}}
.btn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px;font-weight:600}
.btn.on{background:var(--land);color:#fff;border-color:transparent}
.btn:active{opacity:.6}
/* ---- 地圖 ---- */
.body{flex:1;min-height:0;display:flex;position:relative}
.mapwrap{position:relative;flex:1;min-width:0;min-height:0;background:var(--forest);overflow:hidden;touch-action:none}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;--isc:1}
.layer>svg{display:block;position:absolute;left:0;top:0}   /* 只針對場景 svg；圖標裡的小 svg 不受影響 */
#L-base{position:absolute;left:0;top:0;display:block;pointer-events:none;-webkit-user-drag:none;backface-visibility:hidden}
.zone{fill:rgba(255,255,255,0);stroke:none;pointer-events:all;cursor:pointer}
#L-outline{stroke-width:calc(2.5px * var(--isc))}
#L-outline2{stroke-width:calc(1px * var(--isc))}
@media (hover:hover){.zone:hover{stroke:#fff;stroke-opacity:.5;stroke-width:calc(1.5px * var(--isc))}}
#L-outline{fill:none;stroke:var(--outline);stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
#L-outline2{fill:none;stroke:var(--outline-inner);pointer-events:none}
#L-raster{opacity:0}
.ov{position:absolute;left:0;top:0;width:0;height:0}
/* 區域名牌 */
.zl,.mk{transform:scale(var(--isc));will-change:transform}
.zl,.mk .n{transition:opacity .15s}
.layer.zooming .zl,.layer.zooming .mk .n{opacity:0}   /* 縮放中先淡掉名牌與文字，手勢結束再重新排版 */
.zl{position:absolute;width:0;height:0;pointer-events:none;transition:opacity var(--dur)}
.zl .s{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;background:var(--land);color:#fff;border-radius:6px;padding:4px 9px;text-align:center;white-space:nowrap;line-height:1.15;box-shadow:0 1px 0 rgba(0,0,0,.18),0 2px 8px rgba(10,31,92,.28),inset 0 0 0 1px rgba(255,255,255,.18);transition:background var(--dur),box-shadow var(--dur)}
.zl.hot .s .zh::before{content:"";display:inline-block;width:11px;height:11px;margin-right:3px;vertical-align:-1px;background:url(img/kv/star.png) center/contain no-repeat}   /* 必看區：名牌前一顆主視覺的星 */
#zlabels.far .zl.hot .s .zh::before{width:9px;height:9px;margin-right:2px}
.zl .s::before{content:"";position:absolute;left:-8px;right:-8px;top:-12px;bottom:-12px}
.zl .s .zh{display:block;font-size:13px;font-weight:600;letter-spacing:.2px}
.zl .s .en{display:block;font-size:9px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.78);margin-top:1px}
#zlabels.far .s{padding:3px 8px}
#zlabels.far .s .zh{font-size:12px}
#zlabels.far .s .en{display:none}
.zl.dim{opacity:.55}
.zl.hide{opacity:0}
.zl.hide .s{pointer-events:none}
.zl.on .s{background:linear-gradient(135deg,#1C3F8F 0%,#3D6CC4 100%);box-shadow:0 2px 10px rgba(10,31,92,.35),inset 0 0 0 1.5px var(--gold);transform:translate(-50%,calc(-100% - 16px)) scale(1.08)}
/* 圖標 */
.mk{position:absolute;width:0;height:0;cursor:pointer}
.mk::before{content:"";position:absolute;left:-22px;top:-22px;width:44px;height:44px}
.mk img{position:absolute;left:-20px;top:-20px;width:40px;height:40px;display:block;transform-origin:50% 50%;transition:transform var(--dur) ease-out;pointer-events:none}
.portrait #marks.far .mk img{left:-16px;top:-16px;width:32px;height:32px}
.mk .dot{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px #fff;pointer-events:none}
.mk .d{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--land);border:1.5px solid #fff;box-shadow:0 1px 4px rgba(10,31,92,.4);display:flex;align-items:center;justify-content:center;pointer-events:none}
.mk .d svg{width:14px;height:14px;fill:#fff}
.mk .n{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;width:max-content;max-width:230px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;line-height:1.2;padding:2px 7px;border-radius:6px;border:1px solid var(--chip-border);white-space:nowrap;pointer-events:none;transition:background var(--dur),color var(--dur)}
.mk .n .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk.img .n.up{top:auto;bottom:22px}
.mk.disc .n.up{top:auto;bottom:16px}
.mk.noicon .n.up{top:auto;bottom:6px}

.mk.hide{display:none}
body.has-place .zl.on .s{background:var(--land);box-shadow:0 1px 0 rgba(0,0,0,.18),0 2px 8px rgba(10,31,92,.28),inset 0 0 0 1px rgba(255,255,255,.18)}
.mk .n.hide{visibility:hidden}
.mk.img .n{top:22px}
.mk.disc .n{top:16px}
.mk.noicon .n{top:6px}
.mk.img .n.r,.mk.img .n.l,.mk.disc .n.r,.mk.disc .n.l,.mk.noicon .n.r,.mk.noicon .n.l{top:0;bottom:auto;transform:translateY(-50%)}
.mk.img .n.r{left:26px}.mk.disc .n.r{left:18px}.mk.noicon .n.r{left:10px}
.mk.img .n.l,.mk.disc .n.l,.mk.noicon .n.l{left:auto}.mk.img .n.l{right:26px}.mk.disc .n.l{right:18px}.mk.noicon .n.l{right:10px}
.mk .n .tm{display:inline-block;flex-shrink:0;margin-left:0;padding:0 0 0 6px;border-left:1px solid var(--chip-border);color:var(--ink);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.mk .n.hastm{padding-right:3px}
.mk.on{z-index:3}
.mk.on img{transform:scale(1.25)}
.mk.on .d{border-color:var(--gold);box-shadow:0 0 0 2.5px rgba(226,199,122,.55),0 1px 4px rgba(10,31,92,.4)}
.mk.on img{filter:drop-shadow(0 0 5px rgba(226,199,122,.95)) drop-shadow(0 0 1px #fff)}   /* 選中的動物：主視覺的金色星光 */
.mk.on .dot{box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--ink)}
.mk.on .n{background:var(--land);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(10,31,92,.3)}
.mk.on .n .tm{color:#fff;border-left-color:rgba(255,255,255,.4)}
/* 地圖上的控制 */
.backpill{position:absolute;left:12px;top:12px;height:40px;padding:0 12px 0 8px;display:none;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px;font-weight:600;z-index:4}
.backpill.show{display:flex}
.backpill svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.backpill .sep{color:var(--ink3)}
.backpill .zn{font-weight:600}
.ctl{position:absolute;right:12px;bottom:calc(12px + var(--safe-bottom));display:none;flex-direction:column;gap:8px;z-index:3}
@media (hover:hover) and (pointer:fine){.ctl{display:flex}}
.ctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-ctl);display:flex;align-items:center;justify-content:center;padding:0}
.ctl svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none}
.editbar{display:none;position:absolute;left:12px;top:60px;z-index:4;background:#FFF8E6;border:1px solid #F5DFA0;color:#8A6400;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;max-width:70%}
.edit .editbar{display:block}
/* ---- 側欄／底部抽屜 ---- */
.drawer{position:relative;background:#fff;display:flex;flex-direction:column;min-height:0;z-index:5}
.drawer::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;z-index:7;background:var(--prism)}   /* 與 App 磁磚同一條虹彩細線 */
.dinner{display:flex;flex-direction:column;min-height:0;height:100%;overflow:hidden}
.dhandle{display:none;position:absolute;left:-32px;top:16px;width:32px;height:88px;background:#fff;border:1px solid var(--line);border-right:none;border-radius:10px 0 0 10px;box-shadow:var(--shadow-ctl);align-items:center;justify-content:center;z-index:7;padding:0}
.dhandle svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sheethead{display:none;flex-shrink:0}
.grab{height:16px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.grab::after{content:"";width:36px;height:4px;border-radius:2px;background:var(--grabber)}
.peekrow{height:72px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
.peekrow.hidden{display:none}
.peekrow .strip{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;align-items:center;padding:2px 0}
.lchip{flex-shrink:0;height:40px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:6px;display:flex;gap:8px;align-items:center;background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
.lchip img{width:20px;height:20px}
.lchip:active{opacity:.6}
.peekrow .iconb{width:40px;height:40px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.peekrow .iconb svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.peekrow .pnav{display:flex;flex-shrink:0;margin-left:-4px}
.peekrow .pnav .iconb{width:34px;border:1px solid var(--line);border-radius:8px;background:#fff}
.peekrow .pnav .iconb+.iconb{margin-left:4px}
.peekrow .iconb:disabled{opacity:.3}
.peekrow .ic{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.peekrow .ic img{width:32px;height:32px;display:block}
.peekrow .lk{flex:1;min-width:0}
.peekrow .lk .zh{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peekrow .lk .en{font-size:11px;font-weight:400;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.peekrow .pstrip{display:flex;gap:8px;overflow-x:auto;flex-shrink:0;max-width:45%;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.peekrow .pstrip::-webkit-scrollbar,.peekrow .strip::-webkit-scrollbar,.dtabs::-webkit-scrollbar{display:none}
.peekrow .strip,.dtabs{scrollbar-width:none}
.peekrow .pstrip img{width:32px;height:32px;flex-shrink:0;padding:4px;box-sizing:content-box}
.peekrow .right{text-align:right;flex-shrink:0}
.peekrow .right .tm{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.peekrow .right .nt{font-size:11.5px;color:var(--ink2);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead{height:48px;display:flex;align-items:center;padding:0 8px 0 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.seg{display:flex;gap:4px;height:48px;flex:1}
.seg .dt{position:relative;flex:0 0 auto;padding:0 10px;height:48px;background:transparent;border:none;font-size:14px;font-weight:400;color:var(--ink2)}
.seg .dt.on{color:var(--ink);font-weight:600}
.seg .dt.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:linear-gradient(90deg,#0A1F5C,#3D6CC4)}
.seg .dt:active{opacity:.6}
.sbtn{width:40px;height:40px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0}
.sbtn svg{width:20px;height:20px;stroke:var(--ink);stroke-width:1.75;fill:none;stroke-linecap:round}
.sbtn.on{background:var(--land)}
.sbtn.on svg{stroke:#fff}
.search{display:none;padding:8px 16px 4px;flex-shrink:0}
.search.open{display:block}
.search input{width:100%;height:40px;font-size:16px;font-weight:400;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 12px;-webkit-user-select:text;user-select:text}
.search input:focus{border-color:var(--sky3);outline:none;box-shadow:0 0 0 3px rgba(61,108,196,.18)}
.search input::placeholder{color:var(--ink3)}
.dlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(12px + var(--safe-bottom));touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--ink3) transparent}
.peekrow .strip,.peekrow .pstrip{touch-action:pan-x}
@media (orientation:portrait) and (min-width:640px){.dlist>*,.peekrow>*{max-width:600px}.dlist>.zr,.dlist>.item,.dlist>.gh,.dlist>.desc,.dlist>.cap,.dlist>.empty{margin-inline:auto}.peekrow{justify-content:center}}
.zr{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.zr:active{opacity:.6}
.zr .tx{flex:1;min-width:0}
.zr .zh{display:flex;align-items:center;gap:6px;min-width:0;font-size:16px;font-weight:600;color:var(--ink);line-height:1.25}
.zr .zh .nm,.item .zh .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zr .en{font-size:11.5px;font-weight:400;color:var(--ink2);letter-spacing:.3px;line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zr .th{display:flex;gap:6px;flex-shrink:0}
.zr .th img{width:32px;height:32px;display:block}
.tag{display:inline-block;flex-shrink:0;margin-left:0;padding:1px 5px;border:1px solid var(--ink);border-radius:3px;font-size:10.5px;font-weight:600;color:var(--ink);vertical-align:2px;line-height:1.2}
.tag img{width:11px;height:11px;margin-right:3px;vertical-align:-1px;filter:brightness(.55) saturate(1.4)}
.backrow{height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;width:100%}
.backrow svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.zhd{padding:4px 16px 10px}
.zhd .zh{font-size:20px;font-weight:600;color:var(--ink);line-height:1.2}
.zhd .en{font-size:12px;font-weight:400;color:var(--ink2);letter-spacing:.3px;margin-top:2px}
.zhd .desc,.desc{font-size:13.5px;font-weight:400;color:var(--text);line-height:1.55;margin-top:8px}
.desc{padding:10px 16px 2px;margin:0}
.gh{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.5px;margin:14px 16px 6px}
.cap{font-size:11.5px;font-weight:400;color:var(--ink2);margin:6px 16px 0}
.item{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.item:active{opacity:.6}
.item.on{box-shadow:inset 3px 0 0 var(--sky3);background:#EEF3FF}
.item .ic{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.item .ic img{width:32px;height:32px;display:block}
.ini{width:32px;height:32px;border-radius:50%;border:1px solid rgba(10,31,92,.25);background:#EEF3FF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink)}
.d26{width:26px;height:26px;border-radius:50%;background:var(--land);border:1.5px solid #fff;box-shadow:0 1px 3px rgba(10,31,92,.35);display:flex;align-items:center;justify-content:center}
.d26 svg{width:13px;height:13px;fill:#fff}
.item .tx{flex:1;min-width:0}
.item .zh{display:flex;align-items:center;gap:6px;min-width:0;font-size:15px;font-weight:600;color:var(--ink);line-height:1.3}
.item .en{font-size:11.5px;font-weight:400;color:var(--ink2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tm{flex-shrink:0;text-align:right;font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.item .gd{font-size:11px;color:var(--ink2)}
.empty{padding:32px 16px;text-align:center;color:var(--ink3);font-size:13px}
/* 橫向（桌機、iPad 橫放）：右側欄 */
@media (orientation:landscape) and (min-width:640px){
  .body{flex-direction:row}
  .drawer{width:var(--panel-w);border-left:1px solid var(--line);transition:width var(--dur-layout) ease}
  .drawer.closed{width:0;border-left:none}
  .drawer.closed .dinner{visibility:hidden}
  .dhandle{display:flex}
  .zr .th img:nth-child(n+4){display:none}
}
/* 直向（手機、iPad 直放 iframe）：底部抽屜 */
@media not all and (orientation:landscape) and (min-width:640px){
  .body{flex-direction:column}
  .drawer{position:absolute;left:0;right:0;bottom:0;height:46%;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow-sheet);transition:height var(--dur-layout) ease}   /* 疊在地圖上，玻璃後面才有地圖可透 */
  .ctl{top:12px;bottom:auto}
  .drawer.peek{height:calc(var(--peek) + var(--safe-bottom))}
  .drawer.half{height:46%}
  .drawer.full{height:86%}
  .drawer.dragging{transition:none}
  .sheethead{display:block}
}

/* ===== 星引南十字 · 液態玻璃：名牌、圓標、控制鈕、底部抽屜都是半透明玻璃；設施分類用主視覺的虹彩淡色（和區域名牌的深藍玻璃不同色） ===== */
:root{--glass:rgba(255,255,255,.80);--glass-navy:rgba(10,31,92,.66);--glass-edge:rgba(255,255,255,.72);--blur:blur(14px) saturate(1.7);
  --ring-food:#FFB36B;--ring-entry:#7FBCFF;--ring-fac:#B39BFF;
  --p-peach:#FFE2B0;--p-pink:#FFC9E0;--p-blue:#BFE0FF;--p-lav:#D8CCFF;
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU",serif}
.zl .s{background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);color:var(--ink);border:1px solid rgba(255,255,255,.9);border-radius:10px;padding:5px 11px;
  box-shadow:0 2px 10px rgba(10,31,92,.14),0 0 0 .5px rgba(10,31,92,.08)}   /* 淺色霧面玻璃：沒有亮面高光，不要初代 iPhone 感 */
.zl .s .zh{letter-spacing:.2px}
.zl .s .en{color:#5B6A8C}
.zl.hot .s .zh::before{filter:brightness(.55) saturate(1.4)}
.zl.on .s{background:rgba(10,31,92,.88);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:0 6px 18px rgba(10,31,92,.3)}   /* 選中：反白成深藍玻璃 */
.zl.on .s .en{color:rgba(255,255,255,.78)}
.zl.on .s .zh::before{filter:none}
body.has-place .zl.on .s{background:rgba(255,255,255,.74);color:var(--ink);border-color:rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(10,31,92,.14),0 0 0 .5px rgba(10,31,92,.08)}
body.has-place .zl.on .s .en{color:#5B6A8C}
body.has-place .zl.on .s .zh::before{filter:brightness(.55) saturate(1.4)}
.mk .d,.d26{--tint:var(--p-lav);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 2px var(--tint),0 0 0 2.5px rgba(10,31,92,.25),0 2px 6px rgba(10,31,92,.2)}
.mk .d svg,.d26 svg{fill:var(--ink)}
.mk.food .d,.d26.food{--tint:var(--ring-food)}
.mk.entry .d,.d26.entry{--tint:var(--ring-entry)}
.mk.facility .d,.d26.facility{--tint:var(--ring-fac)}
.mk.on .d{box-shadow:0 0 0 2px var(--gold),0 0 0 2.5px rgba(10,31,92,.25),0 0 12px rgba(226,199,122,.95),0 2px 6px rgba(10,31,92,.2)}
.mk .n{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(10,31,92,.18)}
.mk.on .n{background:var(--glass-navy);color:#fff;border-color:rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(10,31,92,.3)}
.ctl button,.backpill,.dhandle{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(10,31,92,.16)}
.top .btn{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.5)}
.zr,.item{background:transparent}
.zhd .zh{font-size:20px;font-weight:600;letter-spacing:.3px}
.tag{border-color:rgba(10,31,92,.35);background:rgba(255,255,255,.7)}
.lchip.on{background:var(--land);color:#fff;border-color:transparent}
@media not all and (orientation:landscape) and (min-width:640px){
  .drawer{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid rgba(255,255,255,.9)}
}
/* ===== 當天路線（星軌）：像主視覺那道細白弧線，停靠點編號；選中的那一段轉成主視覺的金光 ===== */
#L-route{display:none}
body.route #L-route{display:block}
#L-route path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:stroke-opacity var(--dur),stroke var(--dur);pointer-events:none}
#L-route .halo{pointer-events:stroke;cursor:pointer}
/* 線：細白核＋很淡的深藍影，光暈分三層由寬到窄漸弱（像柔光不像螢光筆） */
#L-route .halo{stroke:var(--lc);stroke-opacity:.1;stroke-width:26px}
#L-route .glow2{stroke:var(--lc);stroke-opacity:.2;stroke-width:15px}
#L-route .glow{stroke:var(--lc);stroke-opacity:.42;stroke-width:8px}
#L-route .rim{stroke:rgba(10,31,92,.42);stroke-width:4.5px}
#L-route .core{stroke:#fff;stroke-width:2.4px}
#L-route .leg.dim .halo{stroke-opacity:0}#L-route .leg.dim .glow2{stroke-opacity:.05}#L-route .leg.dim .glow{stroke-opacity:.12}#L-route .leg.dim .rim{stroke-opacity:.14}#L-route .leg.dim .core{stroke-opacity:.3}
#L-route .leg.on .halo{stroke-opacity:.2;stroke-width:32px}#L-route .leg.on .glow2{stroke-opacity:.38;stroke-width:20px}#L-route .leg.on .glow{stroke-opacity:.8;stroke-width:10px}#L-route .leg.on .rim{stroke:rgba(28,63,143,.55);stroke-width:5.5px}#L-route .leg.on .core{stroke:#fff;stroke-width:3px}
/* 方向：白線本身是一段段柔邊的光，整條緩緩往前流（像機場的動態步道），沒有頭尾。dash 用螢幕像素（non-scaling-stroke），縮放不影響節奏 */
#L-route .core{stroke-opacity:.42}
#L-route .fsoft{stroke:#fff;stroke-opacity:.28;stroke-width:5.5px;stroke-linecap:round;stroke-dasharray:30 22;animation:rflow 2.8s linear infinite}
#L-route .flow{stroke:#fff;stroke-opacity:.96;stroke-width:2.6px;stroke-linecap:round;stroke-dasharray:28 24;animation:rflow 2.8s linear infinite}
#L-route .leg.on .flow{stroke:#FFF6DF;stroke-width:3px}#L-route .leg.on .fsoft{stroke:#FFE2B0;stroke-opacity:.5}
#L-route .leg.dim .flow,#L-route .leg.dim .fsoft{stroke-opacity:0}
#L-route.far .core{stroke-width:3px}#L-route.far .rim{stroke-width:5.5px}#L-route.far .glow{stroke-width:10px;stroke-opacity:.55}#L-route.far .glow2{stroke-width:18px;stroke-opacity:.28}#L-route.far .halo{stroke-opacity:.14}
#L-route.far .flow{stroke-width:3px}
@keyframes rflow{from{stroke-dashoffset:0}to{stroke-dashoffset:-52}}
@media (prefers-reduced-motion:reduce){#L-route .flow,#L-route .fsoft{animation:none}}
#rstops{display:none}
body.route #rstops{display:block}
body.route .mk.hero,body.route .zl[data-z="main"],body.route .zl[data-z="ferry"]{display:none}

.rstops{position:relative}
.rstop{position:relative;display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 0 6px 2px;cursor:pointer;border-radius:10px}
.rstop::before{content:"";position:absolute;left:15px;top:-12px;bottom:-12px;width:2px;background:var(--lc)}   /* 時間軸：該段顏色 */
.rstop:first-child::before{top:50%}.rstop:last-child::before{bottom:50%}
.rstop .rn,.peekrow .rn{position:relative;width:28px;height:28px;border-radius:50%;background:var(--ink);border:2px solid var(--lc,var(--gold));color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.rstop.on .rn{background:#fff;color:var(--ink);box-shadow:0 0 0 3px rgba(226,199,122,.6)}
.rstop .tx{flex:1;min-width:0}
.rstop .zh{font-size:15px;font-weight:600;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstop .en{font-size:11.5px;color:var(--ink2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstop .tm{flex-shrink:0;font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;padding-right:4px}
.rstop .ic{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rstop .ic img{width:32px;height:32px}
.rstop:active{opacity:.6}
.rstop.on{background:rgba(255,255,255,.75)}
.rcap{font-size:11.5px;color:var(--ink2);padding:8px 16px 14px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation:none!important}}
</style>

<script>
"use strict";
const D=window.ZOO_DATA, $=s=>document.querySelector(s);
const SW=(D.view&&D.view.w)||3064, SH=(D.view&&D.view.h)||2560, CX=(D.view&&D.view.cx)||1550, CY=(D.view&&D.view.cy)||1400;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params=new URLSearchParams(location.search);
const EDIT=params.get("edit")==="1", EMBED=params.get("embed")==="1";
if(EDIT) document.body.classList.add("edit");
if(EMBED){ document.body.classList.add("embed"); $("#sharebtn").style.display="none"; }
/* 頁首底圖：主視覺 img/kv/bg.jpg，由 CSS .top 負責 */
const LANDQ=matchMedia("(orientation:landscape) and (min-width:640px)");
const isPhone=()=>!LANDQ.matches;
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;
const DUR=REDUCED?0:300;

/* ---- 向量符號 ---- */
const G={
  food:'<path d="M7 2v8a2 2 0 0 0 1 1.7V22h2V11.7A2 2 0 0 0 11 10V2H9.5v6h-1V2H7zm9 0c-1.7 0-3 2.2-3 5v5h2v10h2V2z"/>',
  cafe:'<path d="M4 5h12v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V5zm13 2h1.5a2.5 2.5 0 0 1 0 5H17V7zM4 19h14v2H4z"/>',
  shop:'<path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1 14H5L4 7h3zm2 0h6V6a3 3 0 0 0-6 0v1z"/>',
  gate:'<path d="M4 21V5l8-3 8 3v16h-6v-6h-4v6H4zm5-11h6V8H9v2z"/>',
  ferry:'<path d="M4 15l-1 3h18l-1-3H4zm2-1 1.5-5H9V6h6v3h1.5L18 14H6zm-2 6h16c0 1-1 2-2 2H6c-1 0-2-1-2-2z"/>',
  train:'<path d="M6 3h12a2 2 0 0 1 2 2v10a3 3 0 0 1-3 3l2 3h-2l-2-3H9l-2 3H5l2-3a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2zm0 3v5h12V6H6zm2 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>',
  bus:'<path d="M5 3h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2v2h-3v-2H8v2H5v-2a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 3v6h14V6H5zm1.5 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm11 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>',
  cable:'<path d="M3 4l18 3v2L13 7.5V10h4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h4V7.2L3 6V4zm4 8v4h4v-4H7zm6 0v4h4v-4h-4z"/>',
  toilet:'<path d="M7 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm10 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM5 7h4a1 1 0 0 1 1 1v6H9v8H5v-8H4V8a1 1 0 0 1 1-1zm10 0h4a1 1 0 0 1 1 1l1 7h-2l-.5 7h-3l-.5-7h-2l1-7a1 1 0 0 1 1-1z"/>',
  water:'<path d="M12 2s-6 7-6 12a6 6 0 0 0 12 0c0-5-6-12-6-12zm-2 13a1 1 0 0 1 1 1 2 2 0 0 0 2 2 1 1 0 0 1 0 2 4 4 0 0 1-4-4 1 1 0 0 1 1-1z"/>',
  camera:'<path d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5L9 4zm3 5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>',
  cash:'<path d="M2 6h20v12H2V6zm10 2.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM4 8v2a2 2 0 0 0 2-2H4zm14 0a2 2 0 0 0 2 2V8h-2zM4 16h2a2 2 0 0 0-2-2v2zm16 0v-2a2 2 0 0 0-2 2h2z"/>',
  access:'<path d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm-1 5h2v4h4v2h-4v1l4 6h-2.3L12 15.5 9.3 20H7l4-6V7zm-4 6a5 5 0 0 0 6 6.9v2A7 7 0 0 1 5.5 12H7z"/>',
  hospital:'<path d="M3 5h18v16H3V5zm7 3v3H7v4h3v3h4v-3h3v-4h-3V8h-4z"/>',
  building:'<path d="M3 21V9l9-6 9 6v12h-7v-6h-4v6H3zm6-9h6V9H9v3z"/>',
  theatre:'<path d="M3 4h18v3H3V4zm1 5h16l-1 11H5L4 9zm5 2v6h2v-6H9zm4 0v6h2v-6h-2z"/>',
  picnic:'<path d="M2 8h20v2h-3l2 9h-2l-1.5-6h-11L5 19H3l2-9H2V8zm6 2-.5 2h9l-.5-2H8z"/>',
  moon:'<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/>',
};
const glyph=n=>`<svg viewBox="0 0 24 24">${G[n]||G.gate}</svg>`;
const glyphOf=p=>p.glyph||(p.cat==="food"?"food":p.cat==="entry"?"gate":"building");
const iconImg=p=>`<img src="img/icons/${p.icon}.webp" alt="">`;

/* ---- 座標 ---- */
let overrides=Object.assign({},D.overrides||{}); try{ Object.assign(overrides,JSON.parse(localStorage.getItem("zoo_overrides")||"{}")); }catch(e){}
const gridXY=ref=>{ const m=/^(\d{1,2})([A-M])$/i.exec(String(ref).trim()); if(!m) return null; const x=D.cols[+m[1]],y=D.rows[m[2].toUpperCase()]; return x&&y?{x,y}:null; };
const pointsOf=p=>{ if(overrides[p.id]) return [overrides[p.id]]; if(p.x!=null) return [{x:p.x,y:p.y}]; if(p.points) return p.points.map(([x,y])=>({x,y})); if(p.grid){ const g=gridXY(p.grid); return g?[g]:[]; } if(p.grids) return p.grids.split(",").map(gridXY).filter(Boolean); return []; };
const inPoly=(pt,poly)=>{ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if(((yi>pt.y)!==(yj>pt.y))&&(pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi)) c=!c; } return c; };
const centroid=poly=>{ let x=0,y=0; poly.forEach(([a,b])=>{x+=a;y+=b;}); return {x:x/poly.length,y:y/poly.length}; };

/* 開放折線 Catmull-Rom → 三次貝茲，路線才像主視覺那道弧線而不是鋸齒 */
const curvePath=pts=>{ if(!pts||pts.length<2) return ""; const P=pts.map(([x,y])=>({x,y})); let d=`M${P[0].x} ${P[0].y}`;

    d+=`C${c1.x.toFixed(1)} ${c1.y.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)} ${p2.x} ${p2.y}`; } return d; };

  const vp=viewportFor(target); minSc=minScFor(vp);
  if(p.pts.length===1){ const z=curZone; const s1=Math.max(sc, z?fitScaleFor(z.b,undefined,vp):sc); animateTo(p.pts[0].x,p.pts[0].y,s1,vp); }
  else if(p.pts.length>1){ const xs=p.pts.map(o=>o.x),ys=p.pts.map(o=>o.y); fitBounds({x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)},200,vp,true); }
  settleAfterLayout(vp);
  renderList();
  if(!opts.fromHistory) pushURL(prevZone===curZone);
}
function applyState(st){ st=st||{}; if(st.p&&byId(st.p)){ selectPlace(byId(st.p),{fromHistory:true}); } else if(st.z&&zoneOf(st.z)){ selectZone(zoneOf(st.z),{fromHistory:true}); } else selectZone(null,{fromHistory:true}); }
function goBack(){
  if(curPlace){ const z=curZone; curPlace=null; curShow=null; selectZone(z||null,{fromHistory:true}); pushURL(true); return; }
  /* 膠囊寫「全部區域」就一律回總覽；瀏覽器／硬體返回鍵仍走 popstate 的歷史 */
  selectZone(null,{fromHistory:true}); pushURL(true); }
window.addEventListener("popstate",e=>{ applyState(e.state||Object.fromEntries(new URLSearchParams(location.search))); });
$("#backpill").onclick=()=>{ curPlace=null; curShow=null; selectZone(null,{fromHistory:true}); pushURL(true); };   /* 膠囊寫「全部區域」：不論在分區或地點都直接回總覽 */
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&(curZone||curPlace)) goBack(); });

/* ---- 手勢 ---- */
const pts=new Map(); let start=null,lastTap=0,moved=false,downT=0,gestureRect=null, vTrack=[], flingId=0;
function cancelFling(){ if(flingId){ cancelAnimationFrame(flingId); flingId=0; } }
/* 放手後的慣性：以最後 90ms 的平均速度起步，每 16ms 衰減 6%，碰到邊界就停 */
function fling(vx,vy){ let last=performance.now(); const step=now=>{ const dt=Math.min(40,now-last); last=now; const k=Math.pow(0.94,dt/16);
    const ptx=tx,pty=ty; tx+=vx*dt; ty+=vy*dt; clamp(); if(Math.abs(tx-ptx)<Math.abs(vx*dt)*.5) vx=0; if(Math.abs(ty-pty)<Math.abs(vy*dt)*.5) vy=0;
    vx*=k; vy*=k; apply(); if(Math.hypot(vx,vy)>0.02) flingId=requestAnimationFrame(step); else { flingId=0; queueCull(); } };
  flingId=requestAnimationFrame(step); }
const snap=()=>{ const a=[...pts.values()]; if(a.length>=2) return {n:2,d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,sc,tx,ty}; if(a.length===1) return {n:1,x:a[0].x,y:a[0].y,tx,ty}; return null; };
wrap.addEventListener("pointerdown",e=>{ if(e.target.closest(".ctl,.editbar,.backpill")) return; if(e.pointerType==="mouse"&&e.button!==0) return; if(pts.size>=2) return;
  if(document.activeElement===$("#q")) $("#q").blur();
  cancelCam(); cancelFling(); e.preventDefault(); wrap.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); gestureRect=wrap.getBoundingClientRect(); start=snap(); moved=false; downT=performance.now(); vTrack=[{x:e.clientX,y:e.clientY,t:downT}]; });
wrap.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const cur=snap(); if(!start||!cur||cur.n!==start.n){ start=snap(); return; }
  const r=gestureRect||wrap.getBoundingClientRect();
  if(cur.n===2){ const ns=Math.min(Math.max(start.sc*cur.d/Math.max(start.d,1),minSc),MAX),k=ns/start.sc,mx=start.mx-r.left,my=start.my-r.top; tx=mx-(mx-start.tx)*k+(cur.mx-start.mx); ty=my-(my-start.ty)*k+(cur.my-start.my); sc=ns; moved=true; layer.classList.add("zooming"); }
  else{ const dx=cur.x-start.x,dy=cur.y-start.y; if(!moved){ if(Math.hypot(dx,dy)<=10) return; moved=true; } tx=start.tx+dx; ty=start.ty+dy;
    const now=performance.now(); vTrack.push({x:cur.x,y:cur.y,t:now}); while(vTrack.length>6||(vTrack.length>1&&now-vTrack[0].t>120)) vTrack.shift(); }
  clamp(); scheduleApply(); });
const up=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  const held=performance.now()-downT;
  if(pts.size===0){ layer.classList.remove("zooming"); }
  if(pts.size===0&&moved){ const a=vTrack[0], b=vTrack[vTrack.length-1];
    if(a&&b&&b!==a&&performance.now()-b.t<60&&b.t-a.t>0){ const vx=(b.x-a.x)/(b.t-a.t), vy=(b.y-a.y)/(b.t-a.t); if(Math.hypot(vx,vy)>0.25){ fling(vx,vy); vTrack=[]; } else queueCull(); } else queueCull(); }
  if(pts.size===0&&!moved&&held<300){ const r=gestureRect||wrap.getBoundingClientRect(), now=performance.now();
    if(EDIT&&curPlace&&!curPlace.grids&&!e.target.closest(".mk,.zl")){ overrides[curPlace.id]={x:Math.round((e.clientX-r.left-tx)/sc),y:Math.round((e.clientY-r.top-ty)/sc)}; localStorage.setItem("zoo_overrides",JSON.stringify(overrides)); assignZones(); selectPlace(curPlace,{fromHistory:true}); return; }
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const rs=el&&el.closest&&el.closest(".rs");
    if(rs){ selectStop(+rs.dataset.n); lastTap=0; start=snap(); return; }
    const leg=routeOn&&el&&el.closest&&el.closest("#L-route .leg");
    if(leg){ selectLeg(+leg.dataset.l); lastTap=0; start=snap(); return; }
    const mk=el&&el.closest(".mk");
    if(mk){ if(mk.classList.contains("hero")) selectZone(zoneOf(mk.dataset.z)); else selectPlace(byId(mk.dataset.id)); lastTap=0; start=snap(); return; }
    const zl=el&&el.closest(".zl");
    if(zl){ if(!routeOn) selectZone(zoneOf(zl.dataset.z)); lastTap=0; start=snap(); return; }   /* 路線模式下名牌只是地標，點了不切頁 */
    const zone=el&&el.classList&&el.classList.contains("zone")?zoneOf(el.dataset.z):null;
    if(now-lastTap<300){ lastTap=0; zoomAt(2,e.clientX-r.left,e.clientY-r.top,true); start=snap(); return; }
    lastTap=now;
    if(routeOn){ if(curStop!=null||curLeg!=null){ curStop=null; curLeg=null; drawRouteState(); renderList(); if(isPhone()) setSheet("half",true); } }   /* 路線模式：點空白處取消選段，不離開路線 */
    else if(zone&&(!curZone||curZone.id!==zone.id)) selectZone(zone);
    else if(curPlace){ curPlace=null; curShow=null; renderMarks(); renderList(); pushURL(true); }
  }
  start=snap(); };
const cancelPtr=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); moved=true; start=snap(); if(!pts.size){ layer.classList.remove("zooming"); queueCull(); } };
wrap.addEventListener("pointerup",up); wrap.addEventListener("pointercancel",cancelPtr); wrap.addEventListener("lostpointercapture",cancelPtr);
wrap.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("blur",()=>{ pts.clear(); start=null; moved=false; });
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
wrap.addEventListener("wheel",e=>{ e.preventDefault(); cancelCam(); cancelFling(); const r=wrap.getBoundingClientRect(); layer.classList.add("zooming");
  let d=e.deltaY; if(e.deltaMode===1) d*=16; else if(e.deltaMode===2) d*=wrap.clientHeight; d=Math.max(-120,Math.min(120,d));
  const f=Math.exp(-d*(e.ctrlKey?0.01:0.0025));
  wheeling=true; clearTimeout(wheelT); wheelT=setTimeout(()=>{ wheeling=false; layer.classList.remove("zooming"); queueCull(); },120);
  zoomAt(f,e.clientX-r.left,e.clientY-r.top); },{passive:false});
$("#zin").onclick=()=>zoomAt(1.4,wrap.clientWidth/2,wrap.clientHeight/2,true);
$("#zout").onclick=()=>zoomAt(1/1.4,wrap.clientWidth/2,wrap.clientHeight/2,true);

/* ---- 底部抽屜（直向） ---- */
function setSheet(state,silent){ if(!isPhone()) return; sheet=state||"half"; drawer.classList.remove("peek","half","full"); drawer.classList.add(sheet); drawer.style.height=""; if(!silent){ settleAfterLayout(viewportFor(sheet)); } renderPeek(); }
(function sheetDrag(){
  const head=$("#sheethead"); let drag=null;
  head.addEventListener("pointerdown",e=>{ if(!isPhone()||e.target.closest("button,img")) return; drag={id:e.pointerId,y0:e.clientY,h0:drawer.getBoundingClientRect().height,moved:false,samples:[[performance.now(),0]],target:e.target}; head.setPointerCapture(e.pointerId); });
  head.addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==drag.id) return; const dy=e.clientY-drag.y0; if(!drag.moved&&Math.abs(dy)<10) return; drag.moved=true; drawer.classList.add("dragging");
    const H=body.clientHeight, h=Math.min(H*0.86,Math.max(88+safeB(),drag.h0-dy)); drawer.style.height=h+"px"; drag.samples.push([performance.now(),h]); drag.samples=drag.samples.filter(s=>performance.now()-s[0]<80); });
  const end=e=>{ if(!drag||e.pointerId!==drag.id) return; const d=drag; drag=null; drawer.classList.remove("dragging");
    const t0=d.target||e.target;
    if(!d.moved){ if(t0.closest("#grab,.lk")||(t0.closest(".peekrow")&&!t0.closest("button,img,.lchip"))) setSheet(sheet==="peek"?"half":"peek"); return; }
    const H=body.clientHeight, h=drawer.getBoundingClientRect().height, states={peek:88+safeB(),half:H*0.46,full:H*0.86};
    let v=0; if(d.samples.length>1){ const a=d.samples[0],b=d.samples[d.samples.length-1]; v=(b[1]-a[1])/Math.max(1,b[0]-a[0]); }
    const order=["peek","half","full"]; let cur=order.reduce((best,k)=>Math.abs(states[k]-h)<Math.abs(states[best]-h)?k:best,"half");
    if(Math.abs(v)>0.5){ const i=order.indexOf(cur); if(v>0&&i<2&&states[order[i+1]]>h) cur=order[i+1]; if(v<0&&i>0&&states[order[i-1]]<h) cur=order[i-1]; }
    setSheet(cur); };
  head.addEventListener("pointerup",end); head.addEventListener("pointercancel",end);
})();
$("#q").addEventListener("focus",()=>{ if(isPhone()) setSheet("full"); });

/* ---- 側欄收合（橫向） ---- */
function setPanel(open){ panelOpen=open; drawer.classList.toggle("closed",!open); $("#dhchev").setAttribute("d",open?"M9 5l7 7-7 7":"M15 5l-7 7 7 7"); try{ localStorage.setItem("zoo_panel",open?"open":"closed"); }catch(e){} settleAfterLayout(viewportFor(open?"open":"closed")); }
$("#dhandle").onclick=()=>setPanel(!panelOpen);

/* ---- 搜尋 ---- */
$("#sbtn").onclick=()=>{ searchOpen=!searchOpen; $("#searchbox").classList.toggle("open",searchOpen); $("#sbtn").classList.toggle("on",searchOpen); if(searchOpen) $("#q").focus(); else { query=""; $("#q").value=""; renderList(); } };
$("#q").oninput=e=>{ query=e.target.value; renderList(); };

/* ---- 分享 / 編輯 ---- */
$("#sharebtn").onclick=async()=>{ const url=location.origin+location.pathname;
  if(navigator.share){ try{ await navigator.share({title:"Taronga Zoo 園區地圖",url}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); alert("連結已複製：\n"+url); }catch(e){ prompt("複製連結",url); } };
if(EDIT){
  const top=document.querySelector(".top");
  const rb=document.createElement("button"); rb.className="btn"; rb.textContent="官方標示"; top.appendChild(rb);
  const eb=document.createElement("button"); eb.className="btn"; eb.textContent="匯出"; top.appendChild(eb);
  let rOn=false; rb.onclick=()=>{ rOn=!rOn; rb.classList.toggle("on",rOn); const r=$("#L-raster"); if(r) r.style.opacity=rOn?.55:0; };
  eb.onclick=async()=>{ const t=JSON.stringify(overrides); try{ await navigator.clipboard.writeText(t); alert("已複製 "+Object.keys(overrides).length+" 筆校正位置"); }catch(e){ prompt("複製下方內容",t); } };
}

/* ---- 版面切換與啟動 ---- */
function setLayoutClass(){ document.body.classList.toggle("portrait",isPhone()); document.body.classList.toggle("landscape",!isPhone()); }
function onLayoutChange(){ setLayoutClass(); if(isPhone()){ drawer.classList.remove("closed"); setSheet(sheet||"half",true); } else { drawer.classList.remove("peek","half","full"); drawer.style.height=""; let saved="open"; try{ saved=localStorage.getItem("zoo_panel")||"open"; }catch(e){} panelOpen=saved!=="closed"; drawer.classList.toggle("closed",!panelOpen); $("#dhchev").setAttribute("d",panelOpen?"M9 5l7 7-7 7":"M15 5l-7 7 7 7"); }
  renderList(); measureVp(); const vp=viewportFor(); if(curPlace&&curPlace.pts.length===1){ fit(vp); const z=curZone; goTo(curPlace.pts[0].x,curPlace.pts[0].y,z?fitScaleFor(z.b,undefined,vp):sc,vp); } else if(curZone) { fit(vp); fitBounds(curZone.b,undefined,vp); } else fit(vp); settleAfterLayout(vp); }
LANDQ.addEventListener?LANDQ.addEventListener("change",onLayoutChange):LANDQ.addListener(onLayoutChange);
window.addEventListener("resize",()=>{ if(transitioning) return; if(!curZone&&!curPlace) fit(); else refit(); });
buildScene(); renderRouteStops(); D.zones.forEach(z=>{ z.heroP=heroOf(z); }); measureSigns(); renderTabs(); setLayoutClass();
if(isPhone()) setSheet("half",true); else { let saved="open"; try{ saved=localStorage.getItem("zoo_panel")||"open"; }catch(e){} panelOpen=saved!=="closed"; drawer.classList.toggle("closed",!panelOpen); $("#dhchev").setAttribute("d",panelOpen?"M9 5l7 7-7 7":"M15 5l-7 7 7 7"); }
renderList();
requestAnimationFrame(()=>{ measureVp(); fit(); drawZoneState(); renderMarks();
  const z=params.get("z"), p=params.get("p");
  if(p&&byId(p)){ selectPlace(byId(p),{fromHistory:true}); } else if(z&&zoneOf(z)){ selectZone(zoneOf(z),{fromHistory:true,instant:true}); }
  else if(params.get("tab")==="route"&&R){ tab="route"; renderTabs(); enterRoute(); const r=+params.get("r"); if(r&&stopOf(r)) selectStop(r); else renderList(); }
  try{ history.replaceState({z:curZone&&curZone.id,p:curPlace&&curPlace.id,i:0},"",location.href); }catch(e){} });
</script>
