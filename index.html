<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>星引南十字 · 2026 董事會 Outing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星引南十字">
<meta name="theme-color" content="#0A1F5C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* 主視覺「星引南十字」：深藍星空為品牌面、內容面純白；細線、南十字座、歌劇院線稿、虹彩微光為點綴 */
:root{
  --sky:#0A1F5C; --sky2:#1C3F8F; --sky3:#3D6CC4; --navy:#0B2545;
  --red:#E60012; --red-dk:#C00010; --red-bg:#FDECEE;
  --ink:#1C2740; --ink2:#6B7489; --ink3:#A3A9B8;
  --line:#E6E9F0; --bg:#FFFFFF; --sel:#EEF3FF;
  --green:#2E9E5B; --amber:#C77700; --gold:#E2C77A;
  --pris1:#FFE2B0; --pris2:#FFC9E0; --pris3:#BFE0FF; --pris4:#D8CCFF;
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU","Microsoft JhengHei",serif;
  --script:"Snell Roundhand","Savoye LET","Apple Chancery","Segoe Script","Brush Script MT",cursive;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:#FFFFFF;color:var(--ink);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,input,textarea,select{font-family:inherit}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.serif{font-family:var(--serif);font-weight:400}
.script{font-family:var(--script);font-weight:400}

#frame{max-width:640px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);
  position:relative;overflow:hidden}

/* ===== header：深藍星空 ===== */
#hdr{flex-shrink:0;z-index:5}
.hbar{padding:calc(10px + var(--safe-top)) 0 10px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(100deg,var(--sky) 0%,var(--sky2) 70%,#2A57AE 100%)}
.hbar .sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hbar .row{position:relative;display:flex;align-items:center;gap:10px;padding:0 16px}
.hbar.home{background:linear-gradient(90deg,#0A1F5C 0%,#1A3B89 100%)}   /* 首頁：右端對齊 hero 頂緣，避免接縫 */
.hbar .htitle{font-size:17px;font-weight:600;flex:1;min-width:0;text-align:center;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .hleft,.hbar .hright{display:flex;gap:8px;min-width:74px;align-items:center;flex-shrink:0}
.hbar .hright{justify-content:flex-end}
@media (max-width:480px){.hbar .htitle .pl{display:none}.hbar .hleft,.hbar .hright{min-width:44px}}
.iconbtn{width:42px;height:42px;border-radius:50%;border:none;background:none;color:inherit;font-size:19px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.backbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.hbar .btn.pri{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);color:#fff}
.brand{display:flex;align-items:center;gap:9px;flex:1}
.brand .lion{width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900;overflow:hidden}
.brand .lion img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand .bt{line-height:1.15}
.brand .b1{font-size:13.5px;font-weight:600;letter-spacing:1.5px}
.brand .b2{font-size:10px;opacity:.8;letter-spacing:2.5px}

#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.pagepad{padding:14px 14px 28px}

/* ===== common ===== */
.card{background:#fff;border-radius:14px;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card .ct{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card .ct .st{width:14px;height:14px;color:var(--sky2);flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;border-radius:6px;padding:2.5px 8px}
.pill.red{background:var(--red);color:#fff}
.pill.gray{background:#F0F2F6;color:var(--ink2)}
.pill.green{background:#E8F8EE;color:#1E9E4A}
.pill.amber{background:#FFF3E0;color:#C77700}
.pill.navy{background:var(--sel);color:var(--navy)}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:linear-gradient(135deg,var(--sky) 0%,var(--sky2) 100%);color:#fff}
.btn.line{background:#fff;color:var(--sky2);border:1.5px solid var(--sky2)}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:none;color:var(--sky2)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--line)}
.btn.big{padding:14px 22px;font-size:16px;border-radius:12px}
.btn:active{opacity:.7}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
h3.sect{font-family:var(--serif);font-size:17px;color:var(--navy);font-weight:400;margin:20px 2px 10px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
h3.sect::before{content:"";width:18px;height:1px;background:var(--sky2)}
.vs{color:var(--ink2);font-size:12.5px;margin:0 0 12px;line-height:1.6}
.demo-note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);color:var(--ink2);border-radius:10px;padding:9px 13px;font-size:12px;margin-bottom:12px;line-height:1.55}
.demo-note b{color:var(--ink)}
.placeholder-page{text-align:center;padding:70px 20px;color:var(--ink3)}
.placeholder-page .big{font-size:40px;margin-bottom:12px;color:var(--ink3)}
.placeholder-page .tt{font-size:15px;font-weight:600;color:var(--ink2)}
.placeholder-page .dd{font-size:12.5px;margin-top:6px}
.tabbar{display:flex;gap:8px;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--ink)}
.field textarea{min-height:120px;line-height:1.6;font-size:13.5px;-webkit-user-select:text;user-select:text}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sky2)}
.camlbl{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 16px;font-size:14px;color:var(--ink);cursor:pointer;font-weight:600;background:#fff}
.camlbl input{display:none}

/* ===== 首頁：主視覺 hero ===== */
.hero{position:relative;color:#fff;overflow:hidden;aspect-ratio:600/420;max-height:300px;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(170deg,var(--sky) 0%,var(--sky2) 60%,var(--sky3) 100%)}
.hero .sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .ht{position:relative;padding:18px 18px 18px}
.hero .hk{font-size:11.5px;letter-spacing:3px;opacity:.85;font-weight:600}
.hero .hn{font-family:var(--serif);font-size:42px;font-weight:400;letter-spacing:6px;line-height:1.1;margin-top:6px;text-shadow:0 2px 14px rgba(5,20,60,.5)}
.hero .hs{font-family:var(--script);font-size:19px;margin-top:6px;opacity:.95;letter-spacing:.5px}
.hero .hd{font-size:12.5px;opacity:.85;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .hd .todo{color:var(--gold);font-weight:600}
.hero .hd .dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.6)}
.hero.kv{background-size:cover;background-position:center;min-height:300px}   /* 有主視覺原稿時：原稿當底、標題由原稿呈現 */
.hero.kv .sky{opacity:.2}
.hero.kv .hn,.hero.kv .hs{display:none}
.hero.kv .ht{background:linear-gradient(0deg,rgba(10,31,92,.75),rgba(10,31,92,0))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px 14px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:140px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--pris3),var(--pris4),var(--pris2),var(--pris1))}
.tile:active{background:var(--sel)}
.tile .no{position:absolute;top:12px;right:14px;font-family:var(--serif);font-size:15px;color:var(--ink3);letter-spacing:1px}
.tile .tic{width:40px;height:40px;border-radius:50%;background:var(--sel);color:var(--sky2);display:flex;align-items:center;justify-content:center;font-size:22px}
.tile .tp{font-size:11.5px;color:var(--ink2);font-weight:600;letter-spacing:.5px;margin-top:6px}
.tile .tt{font-size:17px;font-weight:600;color:var(--navy)}
.tile .td{font-size:12px;color:var(--ink2);line-height:1.5}
.tile.main{background:linear-gradient(160deg,var(--sky) 0%,var(--sky2) 100%);border-color:transparent;color:#fff}
.tile.main::before{display:none}
.tile.main .sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tile.main>:not(.no):not(.sky){position:relative}
.tile.main .tic{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.tile.main .tp,.tile.main .td{color:rgba(255,255,255,.82)}
.tile.main .tt{color:#fff}
.tile.main .no{color:rgba(255,255,255,.55)}
.tile.main:active{opacity:.85}
.setlink{text-align:center;font-size:12px;color:var(--ink3);padding:18px 0 4px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}

/* ===== 酒單 ===== */
.wine{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:center}
.wine .wimg{width:58px;height:78px;border-radius:8px;background:var(--sel);color:var(--sky2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.wine .wimg img{width:100%;height:100%;object-fit:cover}
.wine .wm{flex:1;min-width:0}
.wine .wn{font-size:17px;font-weight:600;line-height:1.35;color:var(--navy)}
.wine .wo{font-size:12.5px;color:var(--ink2);margin-top:3px}
.wine .wd{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wine .wp{font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap}
.winedetail .wn{font-family:var(--serif);font-size:24px;color:var(--navy)}
.winedetail .wo{font-size:14px;color:var(--ink2);margin:4px 0 12px}
.winedetail .wd{font-size:15px;line-height:1.75}

/* ===== 飲品點選 ===== */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:9px}
.mitem{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center;cursor:pointer}
.mitem .mimg{margin:-6px -1px 8px;border-radius:9px;overflow:hidden;aspect-ratio:1}
.mitem .mimg img{width:100%;height:100%;object-fit:cover;display:block}
.mitem .nm{font-weight:600;font-size:14px}
.mitem .en{color:var(--ink2);font-size:11.5px;margin-top:2px}
.mitem.on{border-color:var(--sky2);background:var(--sel)}
.ordsum{display:flex;gap:8px;flex-wrap:wrap}
.ordsum .oi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.ordsum .oi b{color:var(--sky2)}
.ordrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ordrow:last-child{border-bottom:none}
.ordrow .who{font-weight:600;min-width:82px}
.ordrow .what{color:var(--ink2);flex:1}
.waiter{padding:24px 20px}
.waiter h2{font-family:var(--serif);font-size:30px;margin:0 0 4px;font-weight:400;color:var(--navy)}
.waiter .sub{color:var(--ink2);font-size:14px;margin-bottom:18px}
.waiter .wrow{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:22px}
.waiter .wrow b{font-size:30px;min-width:56px;color:var(--sky2);font-variant-numeric:tabular-nums;font-weight:600}
.waiter .wrow .wt{font-size:15px;color:var(--ink2)}
.waiter .tot{margin-top:16px;font-size:16px;color:var(--ink2);font-weight:600}

/* ===== 無尾熊紀念照 ===== */
.stagewrap{display:flex;justify-content:center}
.stage{position:relative;width:100%;max-width:440px;aspect-ratio:4/5;background:#0A1F5C;border-radius:14px;overflow:hidden}
.stage video{position:absolute;object-fit:cover;background:#000}
.stage .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage .nocam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-size:13px;gap:8px;padding:20px 20px 170px;text-align:center;line-height:1.6}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid var(--red);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.shutter:active{transform:scale(.94)}
.camrow{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 0 6px;flex-wrap:wrap}
.framenote{display:flex;gap:12px;align-items:center}
.framenote .fbox{width:84px;height:105px;border-radius:10px;overflow:hidden;flex-shrink:0;background:linear-gradient(170deg,#7FA6D8 0%,#3D6CC4 50%,#0A1F5C 100%)}
.framenote .fbox img{width:100%;height:100%;display:block}
.framenote .fn{font-family:var(--serif);font-size:18px;color:var(--navy);letter-spacing:2px}
.framenote .fd{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:3px}
.compose{display:flex;flex-direction:column;align-items:center;gap:10px}
.compose canvas{width:100%;max-width:400px;border-radius:12px;touch-action:none;cursor:grab;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.compose .hint{font-size:12px;color:var(--ink2)}
.compose input[type=range]{width:100%;max-width:400px;accent-color:var(--sky2)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gal .gi{cursor:pointer;text-align:center}
.gal .gi img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#eee}
.gal .gi .gn{font-size:12px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .gi .gt{font-size:10.5px;color:var(--ink3)}

/* ===== 園區地圖 ===== */
.zoopage{display:flex;flex-direction:column;height:100%}
.zooframe{flex:1;width:100%;height:100%;border:0;display:block;background:#fff}

/* ===== modal / toast ===== */
.modal{position:fixed;inset:0;background:rgba(10,31,92,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}
.mbox.confirm{max-width:340px;text-align:center}
.mbox .mh{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.mbox .mh .t{font-weight:600;font-size:15.5px;flex:1}
.mbox .mh .x{border:none;background:#F0F2F6;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--ink)}
.mbox .mb{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mbox .mf{padding:11px 16px calc(11px + var(--safe-bottom)/2);border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.mbox.confirm .mf{justify-content:center}
.mbox.confirm .mb{font-size:14.5px;font-weight:600;padding:24px 18px 18px}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(16px);
  background:var(--navy);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;
  transition:all .25s;z-index:99;pointer-events:none;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== iPad / 寬螢幕 ===== */
@media (min-width:768px){
  #frame{max-width:100%}
  .hbar .row,#screen>.pagepad,#screen>.tabbar,.hero .ht{max-width:960px;margin-left:auto;margin-right:auto;width:100%}
  body{font-size:16px}
  .hbar .htitle{font-size:18px}
  .hero{aspect-ratio:1200/360;min-height:260px;max-height:420px}   /* 與 kvSvg(1200,360) 同比例，構圖完整落版 */
  .hero .hn{font-size:54px}
  .hero .hs{font-size:22px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tile{min-height:176px;padding:20px 18px 16px}
  .tile .tt{font-size:19px}
  .tile .tic{width:46px;height:46px;font-size:25px}
  .wine .wn{font-size:19px}
  .wine .wd{font-size:14px}
  .wine .wimg{width:72px;height:96px}
  .ordrow{font-size:15.5px}
  .ordrow .who{min-width:120px}
  .stage{max-width:520px}
  .compose canvas{max-width:460px}
  .gal{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .koala2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .koala2>div{min-width:0}
}
@media (min-width:1200px){ .tile{min-height:200px} .tiles{gap:16px} }
.waiter .wrow .wt.note{color:var(--sky2)}
</style>
</head>
<body>
<div id="frame">
  <div id="hdr"></div>
  <div id="screen"></div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=8"></script>
</body>
</html>
