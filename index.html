<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>導領e化平台 · 雪梨董事會</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="導領e化">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --red:#E60012; --red-dk:#C00010; --red-bg:#FDECEE;
  --ink:#333336; --ink2:#8E8E93; --ink3:#B9B9BF;
  --line:#E5E5EA; --bg:#FFFFFF; --dark:#2E2E30; --dark2:#3C3C3F;
  --green:#34C759; --amber:#FF9500; --navy:#0B2545; --gold:#C9A24A;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:#FFFFFF;color:var(--ink);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,input,textarea,select{font-family:inherit}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

#frame{max-width:640px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);
  position:relative;overflow:hidden}

/* ===== header ===== */
#hdr{flex-shrink:0;z-index:5}
.hbar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-top)) 16px 10px;background:#fff;border-bottom:1px solid var(--line)}
.hbar.dark{background:var(--dark);border-bottom:none;color:#fff}
.hbar .htitle{font-size:17px;font-weight:800;flex:1;text-align:center}
.hbar .hleft,.hbar .hright{display:flex;gap:8px;min-width:74px;align-items:center}
.hbar .hright{justify-content:flex-end}
.iconbtn{width:34px;height:34px;border-radius:50%;border:none;background:none;color:inherit;font-size:19px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.backbtn{width:34px;height:34px;border-radius:50%;background:rgba(120,120,128,.12);border:none;font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.hbar.dark .backbtn{background:rgba(255,255,255,.18);color:#fff}
.brand{display:flex;align-items:center;gap:8px;flex:1}
.brand .lion{width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900}
.brand .bt{line-height:1.15}
.brand .b1{font-size:13.5px;font-weight:900;letter-spacing:1.5px}
.brand .b2{font-size:10px;opacity:.85;letter-spacing:2px}

#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.pagepad{padding:14px 14px 28px}

/* ===== common ===== */
.card{background:#fff;border-radius:14px;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;border-radius:6px;padding:2.5px 8px}
.pill.red{background:var(--red);color:#fff}
.pill.redln{background:#fff;color:var(--red);border:1px solid var(--red)}
.pill.gray{background:#F0F0F2;color:var(--ink2)}
.pill.green{background:#E8F8EE;color:#1E9E4A}
.pill.amber{background:#FFF3E0;color:#C77700}
.pill.navy{background:#E8EEF8;color:var(--navy)}
.btn{border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--red);color:#fff}
.btn.line{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:none;color:var(--red)}
.btn.big{padding:14px 22px;font-size:16px;border-radius:12px}
.btn:active{opacity:.7}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
h3.sect{font-size:13px;color:var(--ink2);font-weight:800;margin:16px 2px 9px;letter-spacing:.5px}
.vs{color:var(--ink2);font-size:12.5px;margin:0 0 12px;line-height:1.6}
.demo-note{background:#FFF8E6;border:1px solid #F5DFA0;color:#8A6400;border-radius:11px;padding:9px 13px;font-size:12px;margin-bottom:12px;line-height:1.55}
.placeholder-page{text-align:center;padding:70px 20px;color:var(--ink3)}
.placeholder-page .big{font-size:44px;margin-bottom:12px}
.placeholder-page .tt{font-size:15px;font-weight:800;color:var(--ink2)}
.placeholder-page .dd{font-size:12.5px;margin-top:6px}
.tabbar{display:flex;gap:8px;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--ink)}
.field textarea{min-height:120px;line-height:1.6;font-size:13.5px;-webkit-user-select:text;user-select:text}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--red)}
.camlbl{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:9px;
  padding:10px 16px;font-size:14px;color:var(--ink);cursor:pointer;font-weight:700;background:#fff}
.camlbl input{display:none}
.camlbl.pri{background:var(--red);color:#fff;border-color:var(--red)}

/* ===== 首頁 ===== */
.hero{background:linear-gradient(160deg,var(--navy) 0%,#163B6E 100%);padding:14px 16px 20px;color:#fff}
.hero .hk{font-size:11.5px;letter-spacing:2px;opacity:.75;font-weight:700}
.hero .hn{font-size:24px;font-weight:900;margin-top:4px;letter-spacing:1px}
.hero .hd{font-size:13px;opacity:.85;margin-top:6px}
.hero .hd .todo{color:#FFD67A;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:132px;position:relative}
.tile:active{background:var(--red-bg)}
.tile .no{position:absolute;top:12px;right:14px;font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:1px}
.tile .tic{width:40px;height:40px;border-radius:12px;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:22px}
.tile .tt{font-size:16px;font-weight:900;margin-top:4px}
.tile .tp{font-size:11.5px;color:var(--ink2);font-weight:700}
.tile .td{font-size:12px;color:var(--ink2);line-height:1.5}
.tile.main .tic{background:var(--navy);color:var(--gold)}
.setlink{text-align:center;font-size:12px;color:var(--ink3);padding:18px 0 4px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}

/* ===== 酒單 ===== */
.wine{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:center}
.wine .wimg{width:58px;height:78px;border-radius:8px;background:#F0F0F2;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.wine .wimg img{width:100%;height:100%;object-fit:cover}
.wine .wm{flex:1;min-width:0}
.wine .wn{font-size:17px;font-weight:900;line-height:1.35}
.wine .wo{font-size:12.5px;color:var(--ink2);margin-top:3px;font-weight:600}
.wine .wd{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wine .wp{font-size:14px;font-weight:800;color:var(--navy);white-space:nowrap}
.winedetail .wn{font-size:22px;font-weight:900}
.winedetail .wo{font-size:14px;color:var(--ink2);margin:4px 0 12px}
.winedetail .wd{font-size:15px;line-height:1.75}

/* ===== 飲品點選 ===== */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:9px}
.mitem{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center;cursor:pointer}
.mitem .mimg{margin:-6px -1px 8px;border-radius:9px;overflow:hidden;aspect-ratio:1}
.mitem .mimg img{width:100%;height:100%;object-fit:cover;display:block}
.mitem .nm{font-weight:800;font-size:14px}
.mitem .en{color:var(--ink2);font-size:11.5px;margin-top:2px}
.mitem.on{border-color:var(--red);background:var(--red-bg)}
.ordsum{display:flex;gap:8px;flex-wrap:wrap}
.ordsum .oi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700}
.ordsum .oi b{color:var(--red)}
.ordrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ordrow:last-child{border-bottom:none}
.ordrow .who{font-weight:800;min-width:82px}
.ordrow .what{color:var(--ink2);flex:1}
.waiter{padding:24px 20px}
.waiter h2{font-size:26px;margin:0 0 4px;font-weight:900}
.waiter .sub{color:var(--ink2);font-size:14px;margin-bottom:18px}
.waiter .wrow{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:22px}
.waiter .wrow b{font-size:30px;min-width:56px;color:var(--red);font-variant-numeric:tabular-nums}
.waiter .wrow .wt{font-size:15px;color:var(--ink2)}
.waiter .tot{margin-top:16px;font-size:16px;color:var(--ink2);font-weight:700}

/* ===== 無尾熊紀念照 ===== */
.steps{display:flex;gap:8px;margin-bottom:12px}
.step{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:6px}
.step b{width:20px;height:20px;border-radius:50%;background:var(--ink3);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.step.on{border-color:var(--navy);color:var(--navy)}
.step.on b{background:var(--navy)}
.frames{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.fr{flex-shrink:0;width:96px;cursor:pointer;text-align:center}
.fr .fbox{width:96px;height:120px;border-radius:10px;overflow:hidden;border:2.5px solid transparent;background:linear-gradient(170deg,#9FC5E8 0%,#6E9F7A 55%,#3F6B4A 100%)}
.fr .fbox img{width:100%;height:100%;display:block}
.fr.on .fbox{border-color:var(--red)}
.fr .fn{font-size:11.5px;font-weight:700;margin-top:5px;color:var(--ink2)}
.fr.on .fn{color:var(--red)}
.stagewrap{display:flex;justify-content:center}
.stage{position:relative;width:100%;max-width:440px;aspect-ratio:4/5;background:#111;border-radius:14px;overflow:hidden}
.stage video{position:absolute;object-fit:cover;background:#000}
.stage .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage .nocam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ccc;font-size:13px;gap:8px;padding:20px;text-align:center;line-height:1.6}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid var(--red);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.shutter:active{transform:scale(.94)}
.camrow{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 0 6px;flex-wrap:wrap}
.compose{display:flex;flex-direction:column;align-items:center;gap:10px}
.compose canvas{width:100%;max-width:400px;border-radius:12px;touch-action:none;cursor:grab;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.compose .hint{font-size:12px;color:var(--ink2)}
.compose input[type=range]{width:100%;max-width:400px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gal .gi{cursor:pointer;text-align:center}
.gal .gi img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#eee}
.gal .gi .gn{font-size:12px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .gi .gt{font-size:10.5px;color:var(--ink3)}

/* ===== 園區地圖 ===== */
.zoochips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.zchip{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.zchip b{font-size:11px;color:#fff;background:var(--navy);border-radius:6px;padding:1px 6px}
.zchip.on{border-color:var(--navy);background:#E8EEF8}
.mapwrap{position:relative;flex:1;min-height:0;background:#DCE7D3;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.maplayer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.maplayer img{display:block;pointer-events:none;-webkit-user-drag:none}
.pin{position:absolute;width:44px;height:44px;margin:-44px 0 0 -22px;transform-origin:50% 100%;pointer-events:none}
.pin::before{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);box-shadow:0 3px 8px rgba(0,0,0,.35);border:3px solid #fff}
.pin.pulse::after{content:"";position:absolute;left:50%;bottom:-6px;width:28px;height:10px;margin-left:-14px;border-radius:50%;background:rgba(230,0,18,.35);animation:pp 1.2s ease-out infinite}
@keyframes pp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.pinlbl{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mapctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.mapctl button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12);color:var(--ink)}
.maphint{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink2);font-weight:600;pointer-events:none}
.sched{flex-shrink:0;background:#fff;border-top:1px solid var(--line);max-height:40%;display:flex;flex-direction:column}
.sched .sh{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;font-weight:800;color:var(--ink2);cursor:pointer}
.sched .sh .cnt{margin-left:auto;font-size:12px;font-weight:600}
.sched .sl{overflow-y:auto;padding:0 10px 10px;display:none}
.sched.open .sl{display:block}
.srow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.srow:last-child{border-bottom:none}
.srow .st{font-variant-numeric:tabular-nums;font-weight:800;min-width:64px;color:var(--navy)}
.srow .sn{flex:1;font-weight:600}
.srow .sn small{display:block;font-size:11.5px;color:var(--ink2);font-weight:600}
.srow .sg{font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:6px;padding:2px 8px}
.srow.hi{background:#FDECEE}
.zoopage{display:flex;flex-direction:column;height:100%}
.zooframe{flex:1;width:100%;height:100%;border:0;display:block;background:#DCE7D3}

/* ===== modal / toast ===== */
.modal{position:fixed;inset:0;background:rgba(20,20,24,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}
.mbox.confirm{max-width:340px;text-align:center}
.mbox .mh{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.mbox .mh .t{font-weight:800;font-size:15.5px;flex:1}
.mbox .mh .x{border:none;background:#F0F0F2;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--ink)}
.mbox .mb{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mbox .mf{padding:11px 16px calc(11px + var(--safe-bottom)/2);border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.mbox.confirm .mf{justify-content:center}
.mbox.confirm .mb{font-size:14.5px;font-weight:600;padding:24px 18px 18px}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(16px);
  background:#222226;color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;
  transition:all .25s;z-index:99;pointer-events:none;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== iPad / 寬螢幕 ===== */
@media (min-width:768px){
  #frame{max-width:100%}
  #hdr>.hbar,#screen>.pagepad,#screen>.tabbar,#screen>.hero{max-width:960px;margin-left:auto;margin-right:auto;width:100%}
  body{font-size:16px}
  .hbar .htitle{font-size:18px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tile{min-height:168px;padding:20px 18px 16px}
  .tile .tt{font-size:18px}
  .tile .tic{width:46px;height:46px;font-size:25px}
  .wine .wn{font-size:19px}
  .wine .wd{font-size:14px}
  .wine .wimg{width:72px;height:96px}
  .ordrow{font-size:15.5px}
  .ordrow .who{min-width:120px}
  .stage{max-width:520px}
  .compose canvas{max-width:460px}
  .gal{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .fr{width:112px}
  .fr .fbox{width:112px;height:140px}
  .srow{font-size:15px}
  .koala2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .koala2>div{min-width:0}
}
</style>
</head>
<body>
<div id="frame">
  <div id="hdr"></div>
  <div id="screen"></div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
