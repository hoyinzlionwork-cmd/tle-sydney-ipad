/* QR code 的入口：永遠轉到最新版。?to=map.html 開旅客地圖、?q=tab%3Droute 可帶參數；加上 t=時間戳讓瀏覽器不會拿 GitHub Pages 的 10 分鐘快取 */
(function(){
  var p=new URLSearchParams(location.search), to=p.get("to")||"index.html", q=p.get("q")||"";
  if(!/^[\w.-]+\.html$/.test(to)) to="index.html";
  location.replace(to+"?"+(q?q+"&":"")+"t="+Date.now());
})();
</script>
